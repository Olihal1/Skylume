name: Crash report
description: Report a crash involving SkyLume
title: "[Crash]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Use this form when Minecraft closed, froze, or produced a crash report.

        Search existing issues first and test the latest official SkyLume release. A crash report or latest.log is required because the visible error message rarely identifies the real cause.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same crash.
          required: true
        - label: I am using the latest official SkyLume release available for my Minecraft version.
          required: true

  - type: input
    id: skylume_version
    attributes:
      label: SkyLume version
      placeholder: "2.1.0"
    validations:
      required: true

  - type: input
    id: minecraft_version
    attributes:
      label: Minecraft version
      placeholder: "26.1.x"
    validations:
      required: true

  - type: input
    id: fabric_version
    attributes:
      label: Fabric Loader and Fabric API versions
      placeholder: "Fabric Loader ..., Fabric API ..."

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Describe what you did immediately before the crash.
      placeholder: |
        1. Open ...
        2. Click ...
        3. Minecraft crashes
    validations:
      required: true

  - type: textarea
    id: crash_files
    attributes:
      label: Crash report and latest.log
      description: Drag the crash report and logs/latest.log here, or paste links to them.
      placeholder: Drag files here or paste links.
    validations:
      required: true

  - type: textarea
    id: mods
    attributes:
      label: Installed mods
      description: Attach a Modrinth profile export or list the installed mods and versions.
      placeholder: Drag a profile export here or paste the mod list.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add screenshots, videos, or anything else that may help.

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed session tokens, API keys, private server addresses, and other sensitive information from uploaded files.
          required: true
