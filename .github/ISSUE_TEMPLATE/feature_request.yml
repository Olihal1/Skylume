name: Feature request
description: Suggest an improvement or a new SkyLume feature
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an improvement. Search existing issues first so related ideas can stay in one discussion.

  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched the existing issues and did not find the same request.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the limitation, repetitive task, or usability problem.
      placeholder: "I often need to ... but currently ..."
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed feature
      description: Describe the behavior you would like, including where it should appear in SkyLume.
    validations:
      required: true

  - type: dropdown
    id: frequency
    attributes:
      label: How often would you use it?
      options:
        - Every play session
        - Daily
        - Weekly
        - Occasionally
        - Rarely
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Explain how you handle this today or name related implementations that illustrate the idea.

  - type: textarea
    id: additional_context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, examples, or relevant links.
